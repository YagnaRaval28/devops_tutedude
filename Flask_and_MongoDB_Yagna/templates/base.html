<!DOCTYPE html>

  <title>{% block title %}Flask &amp; MongoDB{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="{{ url_for('home') }}">Flask &amp; MongoDB</a>
